name: 🚀 Deploy to remote VM via SSH (Docker Compose v2)

on:
  push:
    branches:
      - master

jobs:
  deploy-to-vm:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Escribir clave SSH y configurar known_hosts
      - name: Write SSH key & known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh
          cat > ~/.ssh/deploy_key << 'EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Validar que la clave es correcta
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          # Agregar host remoto a known_hosts
          ssh-keyscan -t rsa,ecdsa,ed25519 -p "${SSH_PORT:-22}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # 3️⃣ Copiar el código al servidor con rsync
      - name: Copy repository to remote server (rsync)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          PORT=${SSH_PORT:-22}
          echo "📦 Copying files to $SSH_USER@$SSH_HOST:$DEPLOY_PATH (port $PORT)"
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key -p $PORT" ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"

      # 4️⃣ Desplegar en remoto con Docker Compose v2
      - name: Deploy remotely with Docker Compose
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          PORT=${SSH_EFFECTIVE_PORT:-${SSH_PORT:-22}}
          echo "🚀 Deploying on remote host $SSH_HOST"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -e
          cd "$DEPLOY_PATH"
          docker --version
          COMPOSE_CMD=""
          if docker compose version >/dev/null 2>&1; then
            COMPOSE_CMD="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_CMD="docker-compose"
          else
            apt-get update -y
            apt-get install -y ca-certificates curl gnupg
            install -m 0755 -d /etc/apt/keyrings
            if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              chmod a+r /etc/apt/keyrings/docker.gpg
            fi
            if [ ! -f /etc/apt/sources.list.d/docker.list ]; then
              . /etc/os-release
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list
            fi
            apt-get update -y
            if ! apt-get install -y docker-compose-plugin; then
              apt-get install -y docker-compose
            fi
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            fi
          fi
          if [ -z "$COMPOSE_CMD" ]; then
            echo "Docker Compose is not available even after installation attempts." >&2
            exit 1
          fi
          if [ "$COMPOSE_CMD" = "docker compose" ]; then
            compose() { docker compose "$@"; }
          else
            compose() { docker-compose "$@"; }
          fi
          compose version
          compose down || true
          compose pull || true
          compose up -d --build
          compose logs --tail=200 web || true
          REMOTE_SCRIPT

      # 5️⃣ Confirmación
      - name: Finished
        run: echo "✅ Deployment finished successfully"
