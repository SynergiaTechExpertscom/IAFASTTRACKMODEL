      - name: Copy repository to remote server (rsync)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          PORT=${SSH_PORT:-22}
          echo "Copying files to $SSH_USER@$SSH_HOST:$DEPLOY_PATH (port $PORT)"
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=yes -p $PORT" ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"

      - name: Run remote docker compose deploy via ssh
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          PORT=${SSH_PORT:-22}
          echo "Deploying on remote host $SSH_HOST"
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "\
            set -e; \
            cd '$DEPLOY_PATH'; \
            docker --version || (echo 'Docker not found' && exit 1); \
            docker compose version || (echo 'docker compose plugin not found' && exit 1); \
            docker compose down || true; \
            docker compose pull || true; \
            docker compose up -d --build; \
            docker compose logs --tail=200 web || true \
          "

      - name: Finished
        run: echo "Deployment finished"
