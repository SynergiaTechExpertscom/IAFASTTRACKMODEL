name: Deploy to remote VM via SSH

on:
  push:
    branches:
      - master

jobs:
  deploy-to-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH deploy variables
        id: prepare
        run: |
          echo "DEPLOY_PATH=${{ secrets.DEPLOY_PATH }}" >> $GITHUB_OUTPUT

      - name: Setup SSH key on runner
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Add remote host to known_hosts (use provided port or 22)
          PORT=${SSH_PORT:-22}
          ssh-keyscan -p $PORT -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy repository to remote server (rsync)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          PORT=${SSH_PORT:-22}
          echo "Copying files to $SSH_USER@$SSH_HOST:$DEPLOY_PATH (port $PORT)"
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key -p $PORT" ./ $SSH_USER@$SSH_HOST:$DEPLOY_PATH

      - name: Run remote docker-compose deploy via ssh
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          PORT=${SSH_PORT:-22}
          echo "Deploying on remote host $SSH_HOST"
          ssh -i ~/.ssh/deploy_key -p $PORT $SSH_USER@$SSH_HOST "set -e; cd $DEPLOY_PATH; docker --version || (echo 'Docker not found' && exit 1); docker-compose --version || (echo 'docker-compose not found' && exit 1); docker-compose down || true; docker-compose pull || true; docker-compose up -d --build; docker-compose logs --tail=200 web || true"

      - name: Finished
        run: echo "Deployment finished"

# Secrets required by this workflow (add them in repository Settings > Secrets):
# - SSH_HOST: public IP or hostname of your VM
# - SSH_USER: SSH username
# - SSH_PRIVATE_KEY: private key (PEM) for SSH_USER (no passphrase recommended for CI)
# - SSH_PORT: optional, default 22
# - DEPLOY_PATH: remote path where the repo will be copied (e.g. /opt/IAFASTTRACKMODEL)